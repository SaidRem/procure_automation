[project]
name = "procure-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Said", email = "saidremiev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=5.1,<5.2",
    "django-filter>=25.1",
    "djangorestframework>=3.15,<3.16",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[project.scripts]
procure-automation = "procure_automation:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
