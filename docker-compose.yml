services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: procure_db
      POSTGRES_USER: procure_user
      POSTGRES_PASSWORD: procure_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    ports:
      - "6379:6379"


volumes:

  postgres_data:
